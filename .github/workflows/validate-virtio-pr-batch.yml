name: Validate pending VirtIO PR fixes
on:
  push:
    branches:
      - validation/virtio-pr-batch-20260910
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.29.2
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize west workspace
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd ..
          west init -l "$(basename "$GITHUB_WORKSPACE")"
          west update --narrow -o=--depth=1
          west zephyr-export
      - name: Validate PR 117015
        id: pr117015
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/validation/117015-6f19aa424ce6
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "6f19aa424ce6488feca4aef8c1e29971f2fd7215"
          export ZEPHYR_SDK_INSTALL_DIR="/opt/toolchains/zephyr-sdk-$(cat SDK_VERSION)"
          git diff --check HEAD^ HEAD
          git format-patch --stdout --no-signature -1 HEAD | perl scripts/checkpatch.pl --strict -
          west twister --outdir /tmp/twister-117015 -T tests/drivers/virtio/pci_status -p qemu_malta -p qemu_malta/qemu_malta/be -p qemu_x86 -p qemu_cortex_a53 -j 2 --inline-logs -v
          python - <<'PY'
          import json
          suites = json.load(open('/tmp/twister-117015/twister.json'))['testsuites']
          passed = [s for s in suites if s.get('status') == 'passed' and s.get('runnable', True)]
          assert len(passed) == 4, 'Unexpected executed configuration count: ' + repr([(s['name'], s['platform'], s.get('status')) for s in suites])
          assert all(s.get('testcases') and all(t.get('status') == 'passed' for t in s['testcases']) for s in passed), 'A testcase did not execute successfully'
          print('VERIFIED_PR=117015 SHA=6f19aa424ce6488feca4aef8c1e29971f2fd7215 EXECUTED_CONFIGS=' + str(len(passed)))
          PY
      - name: Validate PR 116999
        id: pr116999
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
