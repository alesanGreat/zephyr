      - name: Verify regression sensitivity PR 117015
        if: ${{ !cancelled() && steps.pr117015.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/validation/117015-6f19aa424ce6
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "6f19aa424ce6488feca4aef8c1e29971f2fd7215"
          export ZEPHYR_SDK_INSTALL_DIR="/opt/toolchains/zephyr-sdk-$(cat SDK_VERSION)"
          git restore --source=HEAD^ -- drivers/virtio/virtio_pci.c
          set +e
          west twister --outdir /tmp/twister-negative-117015 -T tests/drivers/virtio/pci_status -p qemu_malta/qemu_malta/be -j 2 --inline-logs -v
          negative_exit=$?
          set -e
          git restore --source=HEAD -- drivers/virtio/virtio_pci.c
          test "$negative_exit" -ne 0
          python - <<'PY'
          import json
          suites = json.load(open('/tmp/twister-negative-117015/twister.json'))['testsuites']
          executed = [s for s in suites if s.get('status') != 'filtered']
          assert len(executed) == 1, 'Expected exactly one regression execution'
          assert executed[0].get('status') == 'failed', 'Negative control must execute and fail, not merely fail to build'
          assert any(t.get('status') == 'failed' for t in executed[0]['testcases']), 'No assertion caught the original bug'
          print('REGRESSION_DETECTED_PR=117015 FIX_SHA=6f19aa424ce6488feca4aef8c1e29971f2fd7215')
          PY
