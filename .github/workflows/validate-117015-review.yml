name: Validate PR 117015 review fixes

on:
  push:
    branches:
      - validation/117015-review-e1ccd98

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.29.2
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize west workspace
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd ..
          west init -l "$(basename "$GITHUB_WORKSPACE")"
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: Run patch checks
        shell: bash
        run: |
          git diff --check HEAD^^ HEAD^
          git diff HEAD^^ HEAD^ | perl scripts/checkpatch.pl --strict -

      - name: Run VirtIO PCI status tests
        shell: bash
        run: |
          export ZEPHYR_SDK_INSTALL_DIR="/opt/toolchains/zephyr-sdk-$(cat SDK_VERSION)"
          west twister -T tests/drivers/virtio/pci_status \
            -p qemu_malta \
            -p qemu_malta/qemu_malta/be \
            -p qemu_x86 \
            -p qemu_cortex_a53 \
            --inline-logs -v
