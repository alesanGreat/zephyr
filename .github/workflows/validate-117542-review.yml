name: Validate PR 117542 review fixes

on:
  push:
    branches:
      - validation/117542-review-db29f75

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.29.2
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize west workspace
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd ..
          west init -l "$(basename "$GITHUB_WORKSPACE")"
          west update --narrow -o=--depth=1
          west zephyr-export
      - name: Run virtqueue size validation
        shell: bash
        run: |
          export ZEPHYR_SDK_INSTALL_DIR="/opt/toolchains/zephyr-sdk-$(cat SDK_VERSION)"
          west twister -T tests/drivers/virtio/virtqueue_size_validation \
            -p native_sim -p native_sim/native/64 -p qemu_x86 \
            -p qemu_cortex_m3 -p qemu_riscv32 -p qemu_leon3 \
            --inline-logs -v
