name: Validate PR 117080 review fixes

on:
  push:
    branches:
      - validation/117080-review-06b2436

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.29.2
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize west workspace
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd ..
          west init -l "$(basename "$GITHUB_WORKSPACE")"
          west update --narrow -o=--depth=1
          west zephyr-export
      - name: Run VirtIO PCI capability endianness test
        shell: bash
        run: |
          export ZEPHYR_SDK_INSTALL_DIR="/opt/toolchains/zephyr-sdk-$(cat SDK_VERSION)"
          west twister -T tests/drivers/virtio/pci_cap_endianness \
            -p qemu_malta -p qemu_malta/qemu_malta/be \
            --inline-logs -v